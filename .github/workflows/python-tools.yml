name: Python Tooling

on:
  push:
    branches: [hexin]
    paths:
      - "tools/mesh_cases.py"
      - "tools/mesh_layout/**"
      - "tests/tools/**"
      - "tools/test_mesh_cases.py"
      - "tools/oneflow_gui/**"
      - "tools/requirements-gui.txt"
      - ".github/workflows/python-tools.yml"
      - "grid/case_catalog.json"
      - "grid/**/case.json"
      - "grid/**/script/**"
  pull_request:
    branches: [hexin]
    paths:
      - "tools/mesh_cases.py"
      - "tools/mesh_layout/**"
      - "tests/tools/**"
      - "tools/test_mesh_cases.py"
      - "tools/oneflow_gui/**"
      - "tools/requirements-gui.txt"
      - ".github/workflows/python-tools.yml"
      - "grid/case_catalog.json"
      - "grid/**/case.json"
      - "grid/**/script/**"

permissions:
  contents: read

jobs:
  python-tools:
    name: Python services (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python tooling
        run: python -m compileall -q tools/mesh_cases.py tools/mesh_layout tools/oneflow_gui
      - name: Test case catalog
        run: python tools/test_mesh_cases.py
      - name: Test rectangle layout compiler
        run: python -m unittest tests.tools.test_compile_rectangle
      - name: Test flat plate layout compiler
        run: python -m unittest tests.tools.test_compile_flat_plate
      - name: Test mesh layout editor document
        run: python -m unittest tests.tools.test_editor_document
      - name: Test explicit layout topology
        run: python -m unittest tests.tools.test_layout_topology
      - name: Test desktop services
        run: python -m unittest tools.oneflow_gui.test_services
      - name: Test GUI test command builder
        run: python -m unittest tools.oneflow_gui.test_test_runner
      - name: Test user data paths
        run: python -m unittest tools.oneflow_gui.test_user_data_paths
      - name: Test mesh layout project copying
        run: python -m unittest tools.oneflow_gui.test_mesh_layout_projects
      - name: Test workflow persistence
        run: python -m unittest tools.oneflow_gui.test_workflow_repository
      - name: Test workflow command construction
        run: python -m unittest tools.oneflow_gui.test_workflow_execution
      - name: Test workflow dependencies
        run: python -m unittest tools.oneflow_gui.test_workflow_dependencies
      - name: Test workflow execution plans
        run: python -m unittest tools.oneflow_gui.test_workflow_plan
      - name: Test workflow graph runner
        run: python -m unittest tools.oneflow_gui.test_workflow_graph_runner
      - name: Test workflow process execution
        run: python -m unittest tools.oneflow_gui.test_workflow_process
      - name: Test runtime parameter overrides
        run: python -m unittest tools.oneflow_gui.test_workflow_runtime_overrides
      - name: Test isolated workflow case staging
        run: python -m unittest tools.oneflow_gui.test_workflow_case_runtime
