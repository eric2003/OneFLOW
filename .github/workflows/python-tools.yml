name: Python Tooling

on:
  push:
    branches: [hexin]
    paths:
      - "tools/mesh_cases.py"
      - "tools/mesh_layout/**"
      - "grid/stl_import/**"
      - "grid/stl_to_gmsh/**"
      - "grid/tests/**"
      - "grid/tests/**"
      - "tools/test_mesh_cases.py"
      - "tools/oneflow_gui/**"
      - "tools/verification/**"
      - "tools/requirements-gui.txt"
      - ".github/workflows/python-tools.yml"
      - "grid/case_catalog.json"
      - "grid/**/case.json"
      - "grid/**/script/**"
  pull_request:
    branches: [hexin]
    paths:
      - "tools/mesh_cases.py"
      - "tools/mesh_layout/**"
      - "grid/stl_import/**"
      - "grid/stl_to_gmsh/**"
      - "grid/tests/**"
      - "grid/tests/**"
      - "tools/test_mesh_cases.py"
      - "tools/oneflow_gui/**"
      - "tools/verification/**"
      - "tools/requirements-gui.txt"
      - ".github/workflows/python-tools.yml"
      - "grid/case_catalog.json"
      - "grid/**/case.json"
      - "grid/**/script/**"

permissions:
  contents: read

jobs:
  python-tools:
    name: Python services (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 gmsh
      - name: Install GUI test dependency
        run: python -m pip install -r tools/requirements-gui.txt
      - name: Compile Python tooling
        run: python -m compileall -q tools/mesh_cases.py tools/mesh_layout grid/stl_import grid/stl_to_gmsh tools/oneflow_gui tools/verification
      - name: Test case catalog
        run: python tools/test_mesh_cases.py
      - name: Test planar STL to Gmsh geometry generation
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_stl_to_gmsh_geometry
      - name: Test native and Python STL-to-Gmsh Cases
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_stl_to_gmsh_cases
      - name: Test Mesh-to-CFD Validation graph
        run: python -m unittest tools.oneflow_gui.test_mesh_validation
      - name: Test rectangle layout compiler
        run: python -m unittest grid.tests.python.mesh_layout.test_compile_rectangle
      - name: Test flat plate layout compiler
        run: python -m unittest grid.tests.python.mesh_layout.test_compile_flat_plate
      - name: Test mesh layout editor document
        run: python -m unittest grid.tests.python.mesh_layout.test_editor_document
      - name: Test explicit layout topology
        run: python -m unittest grid.tests.python.mesh_layout.test_layout_topology
      - name: Test desktop services
        run: python -m unittest tools.oneflow_gui.test_services
      - name: Test background task host lifecycle
        run: python -m unittest tools.oneflow_gui.test_background_task_manager tools.oneflow_gui.test_background_task_host
      - name: Test case queue worker
        run: python -m unittest tools.oneflow_gui.test_main_window
      - name: Test GUI test command builder and registry consistency
        run: python -m unittest tools.oneflow_gui.test_test_runner tools.oneflow_gui.test_test_inventory
      - name: Test cross-platform executable discovery
        run: python -m unittest tools.oneflow_gui.test_executable_discovery
      - name: Test process tree lifecycle
        run: python -m unittest tools.oneflow_gui.test_process_control
      - name: Test case runner process lifecycle
        run: python -m unittest tools.oneflow_gui.test_runner_process
      - name: Test configured CTest discovery parser
        run: python -m unittest tools.verification.test_ctest_discovery
      - name: Test verification contract catalog
        run: python -m unittest tools.verification.test_contract_catalog
      - name: Test LaTeX formula preview
        run: python -m unittest tools.verification.test_latex_preview
      - name: Test Formula and Knowledge catalog
        run: python -m unittest tools.verification.test_curve_catalog
      - name: Test Vencat analytic reference profiles
        run: python -m unittest tools.verification.test_vencat_reference
      - name: Test Contract Workbench dialog
        run: python -m unittest tools.oneflow_gui.test_contract_workbench_dialog
      - name: Test Mesh Generation Workbench
        run: python -m unittest tools.oneflow_gui.test_mesh_generation_dialog
      - name: Test Boundary Conditions Workbench
        run: python -m unittest tools.oneflow_gui.test_boundary_conditions_workbench
      - name: Test source editor process launch
        run: python -m unittest tools.oneflow_gui.test_source_editor
      - name: Test verification execution records
        run: python -m unittest tools.verification.test_execution_records
      - name: Test Python execution evidence capture
        run: python -m unittest tools.oneflow_gui.test_execution_capture
      - name: Test workflow execution evidence capture
        run: python -m unittest tools.oneflow_gui.test_workflow_execution_capture
      - name: Test worker execution evidence integration
        run: python -m unittest tools.oneflow_gui.test_test_dialog_execution_capture
      - name: Test user data paths
        run: python -m unittest tools.oneflow_gui.test_user_data_paths
      - name: Test application settings
        run: python -m unittest tools.oneflow_gui.test_application_settings
      - name: Test runtime environment query
        run: python -m unittest tools.oneflow_gui.test_runtime_environment_dialog
      - name: Test per-run environment evidence and history view
        run: python -m unittest tools.oneflow_gui.test_run_environment_evidence tools.oneflow_gui.test_background_project_runner tools.oneflow_gui.test_run_history_dialog
      - name: Test project discovery and creation
        run: python -m unittest tools.oneflow_gui.test_project_repository tools.oneflow_gui.test_project_templates tools.oneflow_gui.test_rae2822_project_template tools.oneflow_gui.test_new_project_dialog
      - name: Test Case script file discovery
        run: python -m unittest tools.oneflow_gui.test_script_file_discovery
      - name: Test project window parameter actions
        run: python -m unittest tools.oneflow_gui.test_project_window
      - name: Test lossless parameter document
        run: python -m unittest tools.oneflow_gui.test_parameter_document
      - name: Test logical CFD and grid parameter model
        run: python -m unittest tools.oneflow_gui.test_parameter_model
      - name: Test file-independent Case parameter resolution
        run: python -m unittest tools.oneflow_gui.test_parameter_resolution
      - name: Test declarative Case profiles
        run: python -m unittest tools.oneflow_gui.test_case_profile
      - name: Test runtime parameter consumer evidence
        run: python -m unittest tools.oneflow_gui.test_parameter_consumer_catalog
      - name: Test CFD nomenclature knowledge catalog
        run: python -m unittest tools.verification.test_nomenclature_catalog
      - name: Test SQLite parameter catalog
        run: python -m unittest tools.oneflow_gui.test_parameter_catalog_store
      - name: Test mesh layout project copying
        run: python -m unittest tools.oneflow_gui.test_mesh_layout_projects
      - name: Test workflow persistence
        run: python -m unittest tools.oneflow_gui.test_workflow_repository
      - name: Test workflow command construction
        run: python -m unittest tools.oneflow_gui.test_workflow_execution
      - name: Test workflow dependencies
        run: python -m unittest tools.oneflow_gui.test_workflow_dependencies
      - name: Test workflow execution plans
        run: python -m unittest tools.oneflow_gui.test_workflow_plan
      - name: Test workflow graph runner
        run: python -m unittest tools.oneflow_gui.test_workflow_graph_runner
      - name: Test workflow process execution
        run: python -m unittest tools.oneflow_gui.test_workflow_process
      - name: Test runtime parameter overrides
        run: python -m unittest tools.oneflow_gui.test_workflow_runtime_overrides
      - name: Test isolated workflow case staging
        run: python -m unittest tools.oneflow_gui.test_workflow_case_runtime
      - name: Test workspace persistence and editor paths
        run: python -m unittest tools.oneflow_gui.test_workspace_repository tools.oneflow_gui.test_workspace_dialog

  background-task-python-315:
    name: Background task lifecycle (Windows, Python 3.15)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Test detached background task lifecycle
        run: python -m unittest tools.oneflow_gui.test_background_task_manager tools.oneflow_gui.test_background_task_host
