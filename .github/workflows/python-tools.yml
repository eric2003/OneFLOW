name: Python Tooling

on:
  workflow_dispatch:
  push:
    branches: [hexin]
    paths:
      - "tools/mesh_cases.py"
      - "tools/mesh_layout/**"
      - "grid/stl_import/**"
      - "grid/stl_to_gmsh/**"
      - "grid/tests/**"
      - "grid/tests/**"
      - "tools/test_mesh_cases.py"
      - "tools/oneflow_gui/**"
      - "tools/verification/**"
      - "tools/requirements-gui.txt"
      - ".github/workflows/python-tools.yml"
      - "grid/case_catalog.json"
      - "grid/**/case.json"
      - "grid/**/script/**"
  pull_request:
    branches: [hexin]
    paths:
      - "tools/mesh_cases.py"
      - "tools/mesh_layout/**"
      - "grid/stl_import/**"
      - "grid/stl_to_gmsh/**"
      - "grid/tests/**"
      - "grid/tests/**"
      - "tools/test_mesh_cases.py"
      - "tools/oneflow_gui/**"
      - "tools/verification/**"
      - "tools/requirements-gui.txt"
      - ".github/workflows/python-tools.yml"
      - "grid/case_catalog.json"
      - "grid/**/case.json"
      - "grid/**/script/**"

permissions:
  contents: read

jobs:
  python-tools:
    name: Python services (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install GUI test dependency
        run: python -m pip install -r tools/requirements-gui.txt
      - name: Compile Python tooling
        run: python -m compileall -q tools/mesh_cases.py tools/mesh_layout grid/stl_import grid/stl_to_gmsh tools/oneflow_gui tools/verification
      - name: Run change-aware verification gate
        if: github.event_name != 'workflow_dispatch'
        run: python -m tools.verification.change_gate --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
      - name: Run complete Change Gate (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: python -m tools.verification.change_gate --all
      - name: Test case catalog
        run: python tools/test_mesh_cases.py
      - name: Test generic STL surface diagnostics
        run: python -m unittest grid.tests.python.stl_import.test_surface_validation
      - name: Test analytic cylinder cutting and Stage A boundary loops
        run: python -m unittest grid.tests.python.stl_import.test_analytic_cylinder_cut
      - name: Test generic STL surface cutting
        run: python -m unittest grid.tests.python.stl_import.test_generic_stl_surface_cut
      - name: Test analytic cylinder volume mesh generation
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_cylinder_volume_mesh
      - name: Test cylinder cutting Workbench integration
        run: python -m unittest tools.oneflow_gui.test_cylinder_cut_dialog
      - name: Test planar STL to Gmsh geometry generation
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_stl_to_gmsh_geometry
      - name: Test STL-to-Gmsh run reports
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_run_report
      - name: Test parameterized 3-D STL geometry generation
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_stl_geometry_generation
      - name: Test 90-degree pipe-bend STL geometry
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_pipe_bend_geometry
      - name: Compile and smoke-test C++ pipe-bend geometry generator
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -pedantic grid/stl_to_gmsh/3d/pipe_bend/90_degree/geometry/cpp/generate_pipe_bend.cpp -o "$RUNNER_TEMP/pipe_bend_generator"
          "$RUNNER_TEMP/pipe_bend_generator" --output "$RUNNER_TEMP/pipe_bend_90_degree.stl"
          test -s "$RUNNER_TEMP/pipe_bend_90_degree.stl"
          test -s "$RUNNER_TEMP/pipe_bend_90_degree.geometry.json"
          test -s "$RUNNER_TEMP/region_manifest.json"
          test -s "$RUNNER_TEMP/pipe_bend_90_degree.wall.stl"
          test -s "$RUNNER_TEMP/pipe_bend_90_degree.inflow.stl"
          test -s "$RUNNER_TEMP/pipe_bend_90_degree.outflow.stl"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "pipe_bend_90_degree.geometry.json").read_text(encoding="utf-8"))
          regions = json.loads((root / "region_manifest.json").read_text(encoding="utf-8"))
          assert data["schema"] == "oneflow.stl-geometry-manifest"
          assert data["region_triangle_counts"] == {"wall": 4608, "inflow": 48, "outflow": 48}
          assert regions["schema"] == "oneflow.stl-surface-regions"
          assert set(regions["regions"]) == {"wall", "inflow", "outflow"}
          PY
          ONEFLOW_PIPE_BEND_CPP_STL="$RUNNER_TEMP/pipe_bend_90_degree.stl" python -m unittest grid.tests.python.stl_to_gmsh.test_pipe_bend_geometry.PipeBendGeometryTest.test_cpp_generator_matches_python_geometry
      - name: Configure MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and smoke-test C++ pipe-bend geometry generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "pipe_bend"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          cl /nologo /std:c++17 /EHsc /O2 /Z7 "/Fo$outDir\pipe_bend_generator.obj" "/Fe$outDir\pipe_bend_generator.exe" grid\stl_to_gmsh\3d\pipe_bend\90_degree\geometry\cpp\generate_pipe_bend.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$outDir\pipe_bend_generator.exe" --output "$outDir\pipe_bend_90_degree.stl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($asset in @("pipe_bend_90_degree.stl", "pipe_bend_90_degree.geometry.json", "region_manifest.json", "pipe_bend_90_degree.wall.stl", "pipe_bend_90_degree.inflow.stl", "pipe_bend_90_degree.outflow.stl")) {
              if (!(Test-Path (Join-Path $outDir $asset))) { throw "C++ pipe-bend asset was not generated: $asset" }
          }
          @'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "pipe_bend"
          data = json.loads((root / "pipe_bend_90_degree.geometry.json").read_text(encoding="utf-8"))
          regions = json.loads((root / "region_manifest.json").read_text(encoding="utf-8"))
          assert data["schema"] == "oneflow.stl-geometry-manifest"
          assert data["region_triangle_counts"] == {"wall": 4608, "inflow": 48, "outflow": 48}
          assert regions["schema"] == "oneflow.stl-surface-regions"
          assert set(regions["regions"]) == {"wall", "inflow", "outflow"}
          '@ | python -
          $env:ONEFLOW_PIPE_BEND_CPP_STL = "$outDir\pipe_bend_90_degree.stl"
          python -m unittest grid.tests.python.stl_to_gmsh.test_pipe_bend_geometry.PipeBendGeometryTest.test_cpp_generator_matches_python_geometry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native and Python STL-to-Gmsh Cases
        run: python -m unittest grid.tests.python.stl_to_gmsh.test_stl_to_gmsh_cases
      - name: Test Mesh-to-CFD Validation graph
        run: python -m unittest tools.oneflow_gui.test_mesh_validation
      - name: Test non-STL geometry asset registration
        run: python -m unittest tools.oneflow_gui.test_geometry_asset_store
      - name: Test rectangle layout compiler
        run: python -m unittest grid.tests.python.mesh_layout.test_compile_rectangle
      - name: Test flat plate layout compiler
        run: python -m unittest grid.tests.python.mesh_layout.test_compile_flat_plate
      - name: Test mesh layout editor document
        run: python -m unittest grid.tests.python.mesh_layout.test_editor_document
      - name: Test explicit layout topology
        run: python -m unittest grid.tests.python.mesh_layout.test_layout_topology
      - name: Test desktop services
        run: python -m unittest tools.oneflow_gui.test_services
      - name: Test background task host lifecycle
        run: python -m unittest tools.oneflow_gui.test_background_task_manager tools.oneflow_gui.test_background_task_host
      - name: Test case queue worker
        run: python -m unittest tools.oneflow_gui.test_main_window
      - name: Test GUI test command builder and registry consistency
        run: python -m unittest tools.oneflow_gui.test_test_runner tools.oneflow_gui.test_test_inventory
      - name: Test GUI launcher configuration
        run: python -m unittest tools.oneflow_gui.test_launcher
      - name: Test cross-platform executable discovery
        run: python -m unittest tools.oneflow_gui.test_executable_discovery
      - name: Test process tree lifecycle
        timeout-minutes: 3
        run: python -m unittest tools.oneflow_gui.test_process_control
      - name: Test case runner process lifecycle
        run: python -m unittest tools.oneflow_gui.test_runner_process
      - name: Test static CMake GoogleTest target catalog
        run: python -m unittest tools.verification.test_cmake_test_catalog
      - name: Test configured CTest discovery parser
        run: python -m unittest tools.verification.test_ctest_discovery
      - name: Test Contract to configured CTest evidence matching
        run: python -m unittest tools.verification.test_ctest_evidence
      - name: Test verification contract catalog
        run: python -m unittest tools.verification.test_contract_catalog
      - name: Test change preflight and Change Gate selection
        run: python -m unittest tools.verification.test_preflight tools.verification.test_change_gate
      - name: Run repository change preflight
        run: python -m tools.verification.preflight
      - name: Test LaTeX formula preview
        run: python -m unittest tools.verification.test_latex_preview
      - name: Test Formula and Knowledge catalog
        run: python -m unittest tools.verification.test_curve_catalog
      - name: Test Vencat analytic reference profiles
        run: python -m unittest tools.verification.test_vencat_reference
      - name: Test Contract Workbench dialog
        run: python -m unittest tools.oneflow_gui.test_contract_workbench_dialog
      - name: Test Mesh Generation Workbench
        run: python -m unittest tools.oneflow_gui.test_mesh_generation_dialog
      - name: Test mesh project lineage and lifecycle
        run: python -m unittest tools.oneflow_gui.test_mesh_project
      - name: Test Boundary Conditions Workbench
        run: python -m unittest tools.oneflow_gui.test_boundary_conditions_workbench
      - name: Test source editor process launch
        run: python -m unittest tools.oneflow_gui.test_source_editor
      - name: Test verification execution records
        run: python -m unittest tools.verification.test_execution_records
      - name: Test Contract verification status
        run: python -m unittest tools.verification.test_contract_verification
      - name: Test Python execution evidence capture
        run: python -m unittest tools.oneflow_gui.test_execution_capture
      - name: Test per-test CTest execution evidence capture
        run: python -m unittest tools.oneflow_gui.test_ctest_execution_capture
      - name: Test workflow execution evidence capture
        run: python -m unittest tools.oneflow_gui.test_workflow_execution_capture
      - name: Test worker execution evidence integration
        run: python -m unittest tools.oneflow_gui.test_test_dialog_execution_capture
      - name: Test cross-platform path identity and containment
        run: python -m unittest tools.oneflow_gui.test_path_utils
      - name: Test user data paths
        run: python -m unittest tools.oneflow_gui.test_user_data_paths
      - name: Test application settings
        run: python -m unittest tools.oneflow_gui.test_application_settings
      - name: Test runtime environment query
        run: python -m unittest tools.oneflow_gui.test_runtime_environment_dialog
      - name: Test per-run environment evidence and history view
        run: python -m unittest tools.oneflow_gui.test_run_environment_evidence tools.oneflow_gui.test_background_project_runner tools.oneflow_gui.test_run_history_dialog
      - name: Test project discovery and creation
        run: python -m unittest tools.oneflow_gui.test_project_repository tools.oneflow_gui.test_project_templates tools.oneflow_gui.test_rae2822_project_template tools.oneflow_gui.test_new_project_dialog
      - name: Test Case script file discovery
        run: python -m unittest tools.oneflow_gui.test_script_file_discovery
      - name: Test project window parameter actions
        run: python -m unittest tools.oneflow_gui.test_project_window
      - name: Test lossless parameter document
        run: python -m unittest tools.oneflow_gui.test_parameter_document
      - name: Test logical CFD and grid parameter model
        run: python -m unittest tools.oneflow_gui.test_parameter_model
      - name: Test file-independent Case parameter resolution
        run: python -m unittest tools.oneflow_gui.test_parameter_resolution
      - name: Test declarative Case profiles
        run: python -m unittest tools.oneflow_gui.test_case_profile
      - name: Test runtime parameter consumer evidence
        run: python -m unittest tools.oneflow_gui.test_parameter_consumer_catalog
      - name: Test CFD nomenclature knowledge catalog
        run: python -m unittest tools.verification.test_nomenclature_catalog
      - name: Test SQLite parameter catalog
        run: python -m unittest tools.oneflow_gui.test_parameter_catalog_store
      - name: Test mesh layout project copying
        run: python -m unittest tools.oneflow_gui.test_mesh_layout_projects
      - name: Test workflow persistence
        run: python -m unittest tools.oneflow_gui.test_workflow_repository
      - name: Test workflow command construction
        run: python -m unittest tools.oneflow_gui.test_workflow_execution
      - name: Test workflow dependencies
        run: python -m unittest tools.oneflow_gui.test_workflow_dependencies
      - name: Test workflow execution plans
        run: python -m unittest tools.oneflow_gui.test_workflow_plan
      - name: Test workflow graph runner
        run: python -m unittest tools.oneflow_gui.test_workflow_graph_runner
      - name: Test workflow process execution
        run: python -m unittest tools.oneflow_gui.test_workflow_process
      - name: Test runtime parameter overrides
        run: python -m unittest tools.oneflow_gui.test_workflow_runtime_overrides
      - name: Test isolated workflow case staging
        run: python -m unittest tools.oneflow_gui.test_workflow_case_runtime
      - name: Test workspace persistence and editor paths
        run: python -m unittest tools.oneflow_gui.test_workspace_repository tools.oneflow_gui.test_workspace_dialog


  generic-stl-gmsh-integration:
    name: Generic STL volume meshing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ONEFLOW_RUN_GMSH_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Gmsh runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
      - name: Install Gmsh (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://gmsh.info/bin/Linux/gmsh-4.15.2-Linux64.tgz -o "$RUNNER_TEMP/gmsh.tgz"
          mkdir -p "$RUNNER_TEMP/gmsh"
          tar -xzf "$RUNNER_TEMP/gmsh.tgz" -C "$RUNNER_TEMP/gmsh"
          gmsh_bin="$(find "$RUNNER_TEMP/gmsh" -type f -name gmsh | head -n 1)"
          test -n "$gmsh_bin"
          dirname "$gmsh_bin" >> "$GITHUB_PATH"
      - name: Install Gmsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "gmsh-windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP "gmsh-windows"
          Invoke-WebRequest "https://gmsh.info/bin/Windows/gmsh-4.15.2-Windows64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $gmsh = Get-ChildItem -Path $destination -Filter gmsh.exe -Recurse | Select-Object -First 1
          if ($null -eq $gmsh) { throw "Gmsh executable was not found in the downloaded archive." }
          $gmsh.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run generic STL cutting and pipe-bend Gmsh volume-mesh integration
        run: python -m unittest grid.tests.python.stl_import.test_generic_stl_surface_cut grid.tests.python.stl_to_gmsh.test_pipe_bend_geometry.PipeBendGeometryTest.test_gmsh_generates_pipe_bend_volume_with_named_physical_groups

  background-task-python-315:
    name: Background task lifecycle (Windows, Python 3.15)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Test detached background task lifecycle
        run: python -m unittest tools.oneflow_gui.test_background_task_manager tools.oneflow_gui.test_background_task_host
