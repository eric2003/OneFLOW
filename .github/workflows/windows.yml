# This is a basic workflow to help you get started with Actions
name: ONEFLOW_Windows_CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the
  # master and hexin branches.
  push:
    branches: [ master, hexin ]

  pull_request:
    branches: [ master, hexin ]

  # Allows the workflow to be started manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Windows OneFLOW Actions"
    runs-on: windows-latest

    steps:
      # Checkout the repository.
      - uses: actions/checkout@v7

      # Cache the final HDF5, CGNS, and METIS installation trees.
      #
      # MPI is still installed as a system dependency and will be optimized
      # separately after the local dependency cache is verified.
      - name: Cache Windows dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/_deps/hdf5/1.14.3
            ${{ github.workspace }}/_deps/cgns/4.4.0
            ${{ github.workspace }}/_deps/metis/METIS-VS2022-STATIC
          key: oneflow-windows-deps-v2-hdf5-1.14.3-cgns-4.4.0-metis-5.1.0          

      - name: Download and install MPI, HDF5, CGNS, METIS, then build OneFLOW
        run: |
          cd ${{ github.workspace }}
          ls

          $psfile = "${{ github.workspace }}/.github/workflows/oneflow_windows_actions.ps1"
          & $psfile
        shell: pwsh

      - name: Unit Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure -C Release
        shell: pwsh

      - name: Run OneFLOW CFD Tests
        env:
          ONEFLOW_ROOT: ${{ github.workspace }}/install
          HDF5_ROOT: ${{ github.workspace }}/_deps/hdf5/1.14.3
          CGNS_ROOT: ${{ github.workspace }}/_deps/cgns/4.4.0
          METIS_ROOT: ${{ github.workspace }}/_deps/metis/METIS-VS2022-STATIC
          MSMPI_ROOT: C:/Program Files/Microsoft MPI
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== OneFLOW CFD Test ====="

          $oneflow_root = $env:ONEFLOW_ROOT
          $oneflow_bin  = "$oneflow_root/bin"
          $oneflow_exe  = "$oneflow_bin/OneFLOW.exe"

          Write-Host "OneFLOW root : $oneflow_root"
          Write-Host "OneFLOW bin  : $oneflow_bin"
          Write-Host "OneFLOW exe  : $oneflow_exe"

          if ( -not ( Test-Path $oneflow_exe ) ) {
              throw "OneFLOW.exe not found: $oneflow_exe"
          }

          if ( -not ( Test-Path "$oneflow_root/bin/system" ) ) {
              throw "OneFLOW system directory not found: $oneflow_root/bin/system"
          }

          # Add all runtime dependency directories to the current process.
          $runtime_paths = @(
              $oneflow_bin
              "$env:HDF5_ROOT/bin"
              "$env:CGNS_ROOT/bin"
              "$env:MSMPI_ROOT/Bin"
          )

          foreach ( $runtime_path in $runtime_paths ) {
              if ( Test-Path $runtime_path ) {
                  $env:Path = "$runtime_path;$env:Path"
                  Write-Host "Runtime path: $runtime_path"
              }
              else {
                  Write-Host "Runtime path does not exist: $runtime_path"
              }
          }

          Write-Host ""
          Write-Host "===== Runtime DLL candidates ====="

          foreach ( $runtime_path in $runtime_paths ) {
              if ( Test-Path $runtime_path ) {
                  Write-Host "--- $runtime_path ---"

                  Get-ChildItem `
                      $runtime_path `
                      -Filter "*.dll" `
                      -ErrorAction SilentlyContinue |
                      Select-Object Name, FullName, Length
              }
          }

          Write-Host ""
          Write-Host "===== MPI ====="

          $mpiexec = Get-Command mpiexec.exe -ErrorAction SilentlyContinue

          if ( $mpiexec ) {
              Write-Host "mpiexec = $($mpiexec.Source)"
          }
          else {
              throw "mpiexec.exe not found"
          }

          Write-Host ""
          Write-Host "===== OneFLOW direct startup ====="

          & $oneflow_exe

          $oneflow_exit_code = $LASTEXITCODE

          Write-Host "OneFLOW exit code = $oneflow_exit_code"
          Write-Host (
              "OneFLOW exit code hex = 0x{0:X8}" -f $oneflow_exit_code
          )

          if ( $oneflow_exit_code -eq 3221225781 ) {
              throw "OneFLOW.exe failed to load a required DLL."
          }

          Write-Host ""
          Write-Host "===== Run CFD tests ====="

          cd "${{ github.workspace }}/test"

          python --version

          python test.py `
              "mpiexec -n 1" `
              "$oneflow_exe"
        shell: pwsh