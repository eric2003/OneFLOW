# This is a basic workflow to help you get started with Actions
name: OneFLOW_Windows_CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the
  # master and hexin branches.
  push:
    branches: [ master, hexin ]

  pull_request:
    branches: [ master, hexin ]
permissions:
  contents: read

env:
  CMAKE_GENERATOR: "Ninja"
  CMAKE_COMPILER: "MSVC"
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
  ONEFLOW_EXTERNAL_TOOL_TESTS: "OFF"
  
  # Dependency versions
  HDF5_VERSION: "1.14.3"
  CGNS_VERSION: "4.5.2"
  METIS_VERSION: "5.1.0"
  MSMPI_VERSION: "10.1.3"
  
jobs:
  build:
    name: "Windows OneFLOW Actions"
    runs-on: windows-latest

    steps:
      # Checkout the repository.
      - uses: actions/checkout@v7

      # Cache the final HDF5, CGNS, and METIS installation trees.
      #
      # MPI is still installed as a system dependency and will be optimized
      # separately after the local dependency cache is verified.
      - name: Cache Windows dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/_deps/hdf5/${{ env.HDF5_VERSION }}
            ${{ github.workspace }}/_deps/cgns/${{ env.CGNS_VERSION }}
            ${{ github.workspace }}/_deps/metis/METIS-VS2022-STATIC/${{ env.METIS_VERSION }}
          key: oneflow-windows-deps-v3-hdf5-${{ env.HDF5_VERSION }}-cgns-${{ env.CGNS_VERSION }}-metis-${{ env.METIS_VERSION }}            

      - name: Download and install MPI, HDF5, CGNS, METIS, then build OneFLOW
        run: |
          cd ${{ github.workspace }}
          ls

          $psfile = "${{ github.workspace }}/.github/workflows/oneflow_windows_actions.ps1"
          & $psfile
        shell: pwsh


      - name: Install Gmsh 4.15.2 for mesh handoff integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "gmsh-windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP "gmsh-windows"
          Invoke-WebRequest "https://gmsh.info/bin/Windows/gmsh-4.15.2-Windows64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $gmsh = Get-ChildItem -Path $destination -Filter gmsh.exe -Recurse | Select-Object -First 1
          if ($null -eq $gmsh) { throw "Gmsh executable was not found in the downloaded archive." }
          $gmsh.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Unit Test
        env:
          HDF5_ROOT: ${{ github.workspace }}/_deps/hdf5/${{ env.HDF5_VERSION }}
          CGNS_ROOT: ${{ github.workspace }}/_deps/cgns/${{ env.CGNS_VERSION }}
          MSMPI_ROOT: C:/Program Files/Microsoft MPI
        run: |
          $ErrorActionPreference = "Stop"

          $runtime_paths = @(
              "${{ github.workspace }}/build/bin",
              "$env:HDF5_ROOT/bin",
              "$env:CGNS_ROOT/bin",
              "$env:MSMPI_ROOT/Bin"
          )
          foreach ($path in $runtime_paths) {
              if (Test-Path $path) {
                  $env:Path = "$path;$env:Path"
                  Write-Host "Runtime path: $path"
              }
              else {
                  Write-Host "Runtime path does not exist: $path"
              }
          }

          cd "${{ github.workspace }}/build"
          ctest --output-on-failure -C Release
          if ($LASTEXITCODE -ne 0) {
              throw "ctest failed with exit code $LASTEXITCODE."
          }

          cd "${{ github.workspace }}"
          python -m tools.verification.ctest_evidence --build-dir build --configuration Release
          if ($LASTEXITCODE -ne 0) {
              throw "Configured CTest evidence query failed with exit code $LASTEXITCODE."
          }
          cd "${{ github.workspace }}/build"

          python -m unittest discover -s ../tools -p "test_mesh_workflow.py"
          if ($LASTEXITCODE -ne 0) {
              throw "Mesh workflow tests failed with exit code $LASTEXITCODE."
          }

          python -m unittest discover -s ../tools/mesh_export -p "test_*.py"
          python -m unittest discover -s ../tools/mesh_contracts -p "test_*.py"
          if ($LASTEXITCODE -ne 0) {
              throw "Mesh export tests failed with exit code $LASTEXITCODE."
          }
        shell: pwsh 


      - name: Run generic STL to Gmsh to CGNS to OneFLOW handoff
        env:
          ONEFLOW_ROOT: ${{ github.workspace }}/install
          HDF5_ROOT: ${{ github.workspace }}/_deps/hdf5/${{ env.HDF5_VERSION }}
          CGNS_ROOT: ${{ github.workspace }}/_deps/cgns/${{ env.CGNS_VERSION }}
          MSMPI_ROOT: C:/Program Files/Microsoft MPI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimePaths = @(
              "$env:ONEFLOW_ROOT/bin",
              "$env:HDF5_ROOT/bin",
              "$env:CGNS_ROOT/bin",
              "$env:MSMPI_ROOT/Bin"
          )
          foreach ($path in $runtimePaths) {
              if (Test-Path $path) { $env:Path = "$path;$env:Path" }
          }

          $gmsh = Get-Command gmsh.exe -ErrorAction Stop
          $env:ONEFLOW_HOME = Join-Path $env:RUNNER_TEMP "oneflow-generic-curved-shell-home"
          $cutRoot = Join-Path $env:RUNNER_TEMP "oneflow-generic-curved-shell-cut"
          $stageRoot = Join-Path $env:RUNNER_TEMP "oneflow-generic-curved-shell-validation"

          $sourceStl = Join-Path $env:GITHUB_WORKSPACE "grid/stl_to_gmsh/3d/prolate_spheroid/automatic_tetrahedra/python/input/model.stl"
          python -m grid.stl_import.cut_surface_cli --input $sourceStl --output-directory $cutRoot --inlet-point -2.5 0 0 --inlet-normal 1 0 0 --outlet-point 2.5 0 0 --outlet-normal 1 0 0
          if ($LASTEXITCODE -ne 0) { throw "Generic STL cutting failed." }

          $closedStl = Join-Path $cutRoot "closed_surface.stl"
          $projectRoot = (python -c "import sys; from pathlib import Path; from tools.oneflow_gui.mesh_project import create_mesh_project_from_stl; project = create_mesh_project_from_stl(Path.cwd(), Path(sys.argv[1]), 'generic-curved-shell-ci'); print(project['directory'])" $closedStl | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "GUI mesh-project creation failed." }
          if (-not (Test-Path (Join-Path $projectRoot "project.json"))) {
              throw "GUI mesh-project creation did not produce project.json: $projectRoot"
          }

          $meshPath = Join-Path $projectRoot "results/generic-curved-shell-ci.msh"
          python -m grid.stl_to_gmsh.generate_volume_mesh --stl (Join-Path $projectRoot "input/model.stl") --output $meshPath --gmsh $gmsh.Source --mesh-size-min 0.10 --mesh-size-max 0.15
          if ($LASTEXITCODE -ne 0) { throw "Gmsh volume mesh generation failed." }

          python -m tools.oneflow_gui.mesh_validation --oneflow-executable (Join-Path $env:ONEFLOW_ROOT "bin/OneFLOW.exe") --gmsh $gmsh.Source --mesh-case-id stl_to_gmsh_generic_3d_mesh_handoff --mesh-file $meshPath --project-directory $projectRoot --stage-root $stageRoot --max-steps 2
          if ($LASTEXITCODE -ne 0) { throw "Mesh-to-CFD validation, including oneflow_cfd_solve, failed." }

          # An explicit StageRoot is the run directory. Keep the validation
          # report and conversion stages directly beneath this directory.
          $runRoot = $stageRoot
          $reportPath = Join-Path $runRoot "mesh-validation-report.json"
          if (-not (Test-Path $reportPath)) {
              throw "Mesh-to-CFD report is missing: $reportPath"
          }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if ($report.exit_code -ne 0) { throw "Mesh-to-CFD report has non-zero exit code." }
          foreach ($stageName in @("existing_msh_input", "gmsh_to_cgns", "cgns_to_oneflow", "cfd_smoke")) {
              $stage = $report.stages.PSObject.Properties[$stageName].Value
              if ($null -eq $stage -or $stage.status -ne "PASS") {
                  throw "Mesh-to-CFD stage '$stageName' did not pass."
              }
          }
          $cgns = Join-Path $runRoot "gmsh_to_cgns/results/generic_surface_mesh.cgns"
          $native = Join-Path $runRoot "cgns_to_oneflow/results/generic_surface_mesh.oneflow.grid"
          if (-not (Test-Path $cgns)) { throw "CGNS interchange artifact is missing: $cgns" }
          if (-not (Test-Path $native)) { throw "OneFLOW native grid is missing: $native" }
          $regionMap = Join-Path $runRoot "cgns_to_oneflow/results/generic_surface_mesh_bcRegionMap.txt"
          if (-not (Test-Path $regionMap)) { throw "OneFLOW boundary-region map is missing: $regionMap" }
          $regionText = Get-Content -Raw $regionMap
          foreach ($regionName in @("wall", "inflow", "outflow")) {
              if (-not $regionText.Contains($regionName)) {
                  throw "OneFLOW boundary-region map does not contain '$regionName'."
              }
          }
          if ($report.metrics.physical_group_count -lt 4) {
              throw "MSH report did not retain all four physical groups."
          }

          # OECD/NEA-Vattenfall T-junction: reuse the same conversion and
          # two-step CFD smoke chain, keeping every artifact outside the source tree.
          $teeCaseRoot = Join-Path $env:RUNNER_TEMP "oneflow-pipe-tee-case"
          $teeHome = Join-Path $env:RUNNER_TEMP "oneflow-pipe-tee-home"
          $env:ONEFLOW_HOME = $teeHome
          python grid/stl_to_gmsh/3d/pipe_tee/oecd_nea_vattenfall/automatic_tetrahedra/run_pipe_tee_case.py --case-directory $teeCaseRoot --gmsh $gmsh.Source --mesh-size 0.03
          if ($LASTEXITCODE -ne 0) { throw "T-junction Python geometry and volume-mesh generation failed." }

          $teeStl = Join-Path $teeCaseRoot "input/pipe_tee_oecd_nea_vattenfall.stl"
          $teeMesh = Join-Path $teeCaseRoot "results/pipe_tee_oecd_nea_vattenfall.msh"
          if (-not (Test-Path $teeStl)) { throw "T-junction closed STL is missing: $teeStl" }
          if (-not (Test-Path $teeMesh)) { throw "T-junction MSH4 volume mesh is missing: $teeMesh" }

          $teeProjectRoot = (python -c "import sys; from pathlib import Path; from tools.oneflow_gui.mesh_project import create_mesh_project_from_stl; project = create_mesh_project_from_stl(Path.cwd(), Path(sys.argv[1]), 'pipe-tee-oecd-nea-vattenfall-ci'); print(project['directory'])" $teeStl | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "T-junction GUI mesh-project creation failed." }
          $teeProjectManifestPath = Join-Path $teeProjectRoot "project.json"
          if (-not (Test-Path $teeProjectManifestPath)) {
              throw "T-junction GUI mesh-project creation did not produce project.json: $teeProjectRoot"
          }
          python -c "import json,sys; from pathlib import Path; p=Path(sys.argv[1]); data=json.loads(p.read_text(encoding='utf-8')); data['output_mesh']='results/pipe_tee_oecd_nea_vattenfall.msh'; data['mesh_size']=0.03; p.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n', encoding='utf-8')" $teeProjectManifestPath
          if ($LASTEXITCODE -ne 0) { throw "T-junction mesh-project output settings could not be persisted." }
          $teeProjectMesh = Join-Path $teeProjectRoot "results/pipe_tee_oecd_nea_vattenfall.msh"
          New-Item -ItemType Directory -Force -Path (Split-Path $teeProjectMesh) | Out-Null
          Copy-Item $teeMesh $teeProjectMesh -Force

          $teeStageRoot = Join-Path $env:RUNNER_TEMP "oneflow-pipe-tee-validation"
          python -m tools.oneflow_gui.mesh_validation --oneflow-executable (Join-Path $env:ONEFLOW_ROOT "bin/OneFLOW.exe") --gmsh $gmsh.Source --mesh-case-id stl_to_gmsh_pipe_tee_oecd_nea_vattenfall --mesh-file $teeProjectMesh --project-directory $teeProjectRoot --stage-root $teeStageRoot --cfd-template-id laminar_flat_plate --max-steps 2
          if ($LASTEXITCODE -ne 0) { throw "T-junction Mesh-to-CFD two-step smoke test failed." }

          $teeReportPath = Join-Path $teeStageRoot "mesh-validation-report.json"
          if (-not (Test-Path $teeReportPath)) { throw "T-junction Mesh-to-CFD report is missing: $teeReportPath" }
          $teeReport = Get-Content -Raw $teeReportPath | ConvertFrom-Json
          if ($teeReport.exit_code -ne 0) { throw "T-junction Mesh-to-CFD report has non-zero exit code." }
          foreach ($stageName in @("existing_msh_input", "gmsh_to_cgns", "cgns_to_oneflow", "cfd_smoke")) {
              $stage = $teeReport.stages.PSObject.Properties[$stageName].Value
              if ($null -eq $stage -or $stage.status -ne "PASS") {
                  throw "T-junction Mesh-to-CFD stage '$stageName' did not pass."
              }
          }
          $teeCgns = Join-Path $teeStageRoot "gmsh_to_cgns/results/pipe_tee_oecd_nea_vattenfall.cgns"
          $teeNative = Join-Path $teeStageRoot "cgns_to_oneflow/results/pipe_tee_oecd_nea_vattenfall.oneflow.grid"
          $teeRegionMap = Join-Path $teeStageRoot "cgns_to_oneflow/results/pipe_tee_oecd_nea_vattenfall_bcRegionMap.txt"
          if (-not (Test-Path $teeCgns)) { throw "T-junction CGNS artifact is missing: $teeCgns" }
          if (-not (Test-Path $teeNative)) { throw "T-junction OneFLOW native grid is missing: $teeNative" }
          if (-not (Test-Path $teeRegionMap)) { throw "T-junction boundary-region map is missing: $teeRegionMap" }
          $teeRegionText = Get-Content -Raw $teeRegionMap
          foreach ($regionName in @("wall", "inflow", "outflow")) {
              if (-not $teeRegionText.Contains($regionName)) {
                  throw "T-junction boundary-region map does not contain '$regionName'."
              }
          }
          if ($teeReport.metrics.physical_group_count -lt 4) {
              throw "T-junction MSH report did not retain all four physical groups."
          }

          # Exact planar square-duct T-junction: manually triangulated STL,
          # generic region-aware Gmsh volume meshing, then two CFD smoke steps.
          $squareCaseRoot = Join-Path $env:RUNNER_TEMP "oneflow-square-pipe-tee-case"
          $squareHome = Join-Path $env:RUNNER_TEMP "oneflow-square-pipe-tee-home"
          $env:ONEFLOW_HOME = $squareHome
          python grid/stl_to_gmsh/3d/pipe_tee/square_duct/automatic_tetrahedra/run_square_tee_case.py --case-directory $squareCaseRoot --gmsh $gmsh.Source --mesh-size 0.75 --operating-mode main_inlets
          if ($LASTEXITCODE -ne 0) { throw "Square-duct T-junction STL and TETRA_4 generation failed." }
          $squareStl = Join-Path $squareCaseRoot "input/square_tee.stl"
          $squareMesh = Join-Path $squareCaseRoot "results/square_tee.msh"
          if (-not (Test-Path $squareStl) -or -not (Test-Path $squareMesh)) { throw "Square T-junction STL/MSH artifacts are missing." }
          $squareProjectRoot = (python -c "import sys; from pathlib import Path; from tools.oneflow_gui.mesh_project import create_mesh_project_from_stl; project = create_mesh_project_from_stl(Path.cwd(), Path(sys.argv[1]), 'square-pipe-tee-ci'); print(project['directory'])" $squareStl | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Square T-junction GUI mesh-project creation failed." }
          $squareProjectManifest = Join-Path $squareProjectRoot "project.json"
          python -c "import json,sys; from pathlib import Path; p=Path(sys.argv[1]); data=json.loads(p.read_text(encoding='utf-8')); data['output_mesh']='results/square_tee.msh'; data['mesh_size']=0.75; p.write_text(json.dumps(data, indent=2, sort_keys=True)+'\n', encoding='utf-8')" $squareProjectManifest
          if ($LASTEXITCODE -ne 0) { throw "Square T-junction project settings could not be saved." }
          $squareProjectMesh = Join-Path $squareProjectRoot "results/square_tee.msh"
          New-Item -ItemType Directory -Force -Path (Split-Path $squareProjectMesh) | Out-Null
          Copy-Item $squareMesh $squareProjectMesh -Force
          $squareStageRoot = Join-Path $env:RUNNER_TEMP "oneflow-square-pipe-tee-validation"
          python -m tools.oneflow_gui.mesh_validation --oneflow-executable (Join-Path $env:ONEFLOW_ROOT "bin/OneFLOW.exe") --gmsh $gmsh.Source --mesh-case-id stl_to_gmsh_pipe_tee_square_duct_smoke --mesh-file $squareProjectMesh --project-directory $squareProjectRoot --stage-root $squareStageRoot --cfd-template-id laminar_flat_plate --max-steps 2
          if ($LASTEXITCODE -ne 0) { throw "Square T-junction two-step CFD smoke test failed." }
          $squareReportPath = Join-Path $squareStageRoot "mesh-validation-report.json"
          if (-not (Test-Path $squareReportPath)) { throw "Square T-junction validation report is missing." }
          $squareReport = Get-Content -Raw $squareReportPath | ConvertFrom-Json
          if ($squareReport.exit_code -ne 0) { throw "Square T-junction validation report has non-zero exit code." }
          foreach ($stageName in @("existing_msh_input", "gmsh_to_cgns", "cgns_to_oneflow", "cfd_smoke")) {
              $stage = $squareReport.stages.PSObject.Properties[$stageName].Value
              if ($null -eq $stage -or $stage.status -ne "PASS") { throw "Square T-junction stage '$stageName' did not pass." }
          }

      - name: Upload generic STL mesh-to-CFD smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-stl-mesh-cfd-smoke-windows
          path: |
            ${{ runner.temp }}/oneflow-generic-curved-shell-home
            ${{ runner.temp }}/oneflow-generic-curved-shell-validation
            ${{ runner.temp }}/oneflow-pipe-tee-case
            ${{ runner.temp }}/oneflow-pipe-tee-home
            ${{ runner.temp }}/oneflow-pipe-tee-validation
            ${{ runner.temp }}/oneflow-square-pipe-tee-case
            ${{ runner.temp }}/oneflow-square-pipe-tee-home
            ${{ runner.temp }}/oneflow-square-pipe-tee-validation
          if-no-files-found: ignore

      - name: Run OneFLOW Regression Tests
        env:
          ONEFLOW_ROOT: ${{ github.workspace }}/install
          HDF5_ROOT: ${{ github.workspace }}/_deps/hdf5/${{ env.HDF5_VERSION }}
          CGNS_ROOT: ${{ github.workspace }}/_deps/cgns/${{ env.CGNS_VERSION }}
          METIS_ROOT: ${{ github.workspace }}/_deps/metis/METIS-VS2022-STATIC/${{ env.METIS_VERSION }}
          MSMPI_ROOT: C:/Program Files/Microsoft MPI
        run: |
          $ErrorActionPreference = "Stop"

          $oneflow_exe = "$env:ONEFLOW_ROOT/bin/OneFLOW.exe"
          Write-Host "OneFLOW executable: $oneflow_exe"

          if ( -not ( Test-Path $oneflow_exe ) ) {
              throw "OneFLOW.exe not found: $oneflow_exe"
          }

          if ( -not ( Test-Path "$env:ONEFLOW_ROOT/bin/system" ) ) {
              throw "OneFLOW system directory not found: $env:ONEFLOW_ROOT/bin/system"
          }

          $runtime_paths = @(
              "$env:ONEFLOW_ROOT/bin"
              "$env:HDF5_ROOT/bin"
              "$env:CGNS_ROOT/bin"
              "$env:MSMPI_ROOT/Bin"
          )

          foreach ( $runtime_path in $runtime_paths ) {
              if ( Test-Path $runtime_path ) {
                  $env:Path = "$runtime_path;$env:Path"
                  Write-Host "Runtime path: $runtime_path"
              }
              else {
                  Write-Host "Runtime path does not exist: $runtime_path"
              }
          }

          if ( -not ( Get-Command mpiexec.exe -ErrorAction SilentlyContinue ) ) {
              throw "mpiexec.exe not found"
          }

          cd "${{ github.workspace }}/test"
          python -m py_compile test.py gui.py residual_db.py
          python --version

          python test.py `
              "mpiexec -n 1" `
              "$oneflow_exe" `
              "suites/ci-serial.txt"
        shell: pwsh

