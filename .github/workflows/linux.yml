# This is a basic workflow to help you get started with Actions

name: OneFLOW_Linux_CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master, hexin ]
  pull_request:
    branches: [ master, hexin ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
permissions:
  contents: read
  
env:
  GCC_VERSION: 12
  BUILD_PARALLEL_LEVEL: 8

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: "Linux OneFLOW Actions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC ${{ env.GCC_VERSION }}
        run: |
          sudo apt-get update
          sudo apt install gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} -y
          gcc-${{ env.GCC_VERSION }} --version
          g++-${{ env.GCC_VERSION }} --version
          ls /usr/bin/gcc*
        shell: bash
      - name: Install Third party library
        run: |
          echo cd ${{ github.workspace }}
          cd ${{ github.workspace }}
          echo ls
          ls
          sudo apt-get update
          sudo apt-get install libhdf5-dev libcgns-dev libmetis-dev libmpich-dev -y
        shell: bash
      - name: CMake Build and Install
        env:
          CC: gcc-${{ env.GCC_VERSION }}
          CXX: g++-${{ env.GCC_VERSION }}
        run: |
          echo "===== Build environment ====="

          echo "Processor count:"
          nproc

          echo "Memory:"
          free -h

          echo "GCC:"
          gcc-${{ env.GCC_VERSION }} --version | head -n 1

          echo "G++:"
          g++-${{ env.GCC_VERSION }} --version | head -n 1

          echo "CMake:"
          cmake --version | head -n 1

          echo "Make:"
          make --version | head -n 1

          echo "Build parallel level:"
          echo "${{ env.BUILD_PARALLEL_LEVEL }}"

          echo "============================"

          cd ${{ github.workspace }}
          mkdir build
          cd build

          export MPI_HOME_INC="/usr/include/x86_64-linux-gnu/mpich"
          export MPI_HOME_LIB="/usr/lib/x86_64-linux-gnu/libmpich.so"

          export CGNS_HOME_INC="/usr/include"
          export CGNS_HOME_LIB="/usr/lib/x86_64-linux-gnu/libcgns.so"

          export METIS_HOME_INC="/usr/include"
          export METIS_HOME_LIB="/usr/lib/x86_64-linux-gnu/libmetis.so"

          echo "===== CMake Configure ====="

          configure_start=$(date +%s)

          cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/Run ../

          configure_end=$(date +%s)

          echo "CMake Configure: $((configure_end - configure_start)) s"

          echo "===== CMake Build ====="

          build_start=$(date +%s)

          make -j ${{ env.BUILD_PARALLEL_LEVEL }}

          build_end=$(date +%s)

          echo "CMake Build: $((build_end - build_start)) s"

          echo "===== CMake Install ====="

          install_start=$(date +%s)

          make install

          install_end=$(date +%s)

          echo "CMake Install: $((install_end - install_start)) s"

        shell: bash
      - name: Unit Test
        env:
          CC: gcc-${{ env.GCC_VERSION }}
          CXX: g++-${{ env.GCC_VERSION }}
          # 如果 ctest 需要和后面测试一样的环境，也可以把 MPI 相关变量放这里
          MPICH_NO_UCX: 1
          MPICH_CH3_NO_UCX: 1
          MPICH_DEVICE: ch3:sock
          UCX_TLS: tcp,self
        run: |
          cd ${{ github.workspace }}/build
          # 如果之前 cmake 没有开启测试，可以在这里重新配置一次（可选）
          # cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/Run -DBUILD_TESTING=ON ../
          # make -j 4
          ctest --output-on-failure
        shell: bash        
      - name: Run OneFLOW CFD Tests
        env:
          prefix: ${{ github.workspace }}/Run
          MPICH_NO_UCX: 1
          MPICH_CH3_NO_UCX: 1
          MPICH_DEVICE: ch3:sock
          UCX_TLS: tcp,self          
        run: |
          #echo "env.prefix= ${{env.prefix}}"
          #echo "ls ${{env.prefix}}"
          #ls "${{env.prefix}}"
          export PATH=${{env.prefix}}/bin/:${{env.prefix}}/lib:$PATH
          #echo $PATH
          export LD_LIBRARY_PATH=${{env.prefix}}/lib:$LD_LIBRARY_PATH
          #sudo ldconfig
          #ls ${{env.prefix}}/bin
          #ldd ${{env.prefix}}/bin/OneFLOW
          OneFLOW
          cd "${{ github.workspace }}/test"
          ls
          python --version
          #python test.py " " " " linux
          python test.py "mpirun -np 1" "OneFLOW" "suites/cpu-serial.txt" "baselines/residual-baseline.json" "1e-8"
        shell: bash