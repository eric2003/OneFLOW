name: documentation check

on:
  push:
    branches: [hexin, master]
  pull_request:
    branches: [hexin, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path-check:
    name: Documentation path references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test documentation path checker
        run: python3 -m unittest discover -s scripts -p 'test_check_doc_paths.py'
      - name: Check documentation path references
        run: python3 scripts/check-doc-paths.py

  sphinx-build:
    name: Sphinx HTML build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sphinx sphinx-rtd-theme
      - name: Build Sphinx HTML
        run: sphinx-build --keep-going -b html docs/source docs/build/html
