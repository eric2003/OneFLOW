# ENO reconstruction coefficients

eno:
  1:
    - [ 1]                      # r = 0
    - [ 1]                      # r = -1
  
  2:
    - [ -1/2,  3/2]             # r = 1
    - [  1/2,  1/2]             # r = 0
    - [  3/2, -1/2]             # r = -1
  
  3:
    - [  1/3, -7/6, 11/6]       # r = 2
    - [ -1/6,  5/6,  1/3]       # r = 1
    - [  1/3,  5/6, -1/6]       # r = 0
    - [ 11/6, -7/6,  1/3]       # r = -1
  
  4:
    - [  -1/4,  13/12, -23/12, 25/12] # r = 3
    - [  1/12,  -5/12,  13/12,   1/4] # r = 2
    - [ -1/12,   7/12,   7/12, -1/12] # r = 1
    - [   1/4,  13/12,  -5/12,  1/12] # r = 0
    - [ 25/12, -23/12,  13/12,  -1/4] # r = -1
  
  5:
    - [    1/5,  -21/20, 137/60, -163/60, 137/60] # r = 4
    - [  -1/20,   17/60, -43/60,   77/60,    1/5] # r = 3
    - [   1/30,  -13/60,  47/60,    9/20,  -1/20] # r = 2
    - [  -1/20,    9/20,  47/60,  -13/60,   1/30] # r = 1
    - [    1/5,   77/60, -43/60,   17/60,  -1/20] # r = 0
    - [ 137/60, -163/60, 137/60,  -21/20,    1/5] # r = -1
  
  6:
    - [  -1/6,  31/30, -163/60,   79/20, -71/20, 49/20] # r = 5
    - [  1/30, -13/60,   37/60,  -21/20,  29/20,   1/6] # r = 4
    - [ -1/60,   7/60,  -23/60,   19/20,  11/30, -1/30] # r = 3
    - [  1/60,  -2/15,   37/60,   37/60,  -2/15,  1/60] # r = 2
    - [ -1/30,  11/30,   19/20,  -23/60,   7/60, -1/60] # r = 1
    - [   1/6,  29/20,  -21/20,   37/60, -13/60,  1/30] # r = 0
    - [ 49/20, -71/20,   79/20, -163/60,  31/30,  -1/6] # r = -1
  
  7:
    - [     1/7,   -43/42,  667/210, -2341/420,  853/140, -617/140, 363/140] # r = 6
    - [   -1/42,   37/210, -241/420,   153/140, -197/140,  223/140,     1/7] # r = 5
    - [   1/105,  -31/420,  109/420,  -241/420,  153/140,    13/42,   -1/42] # r = 4
    - [  -1/140,     5/84, -101/420,   319/420,  107/210,  -19/210,   1/105] # r = 3
    - [   1/105,  -19/210,  107/210,   319/420, -101/420,     5/84,  -1/140] # r = 2
    - [   -1/42,    13/42,  153/140,  -241/420,  109/420,  -31/420,   1/105] # r = 1
    - [     1/7,  223/140, -197/140,   153/140, -241/420,   37/210,   -1/42] # r = 0
    - [ 363/140, -617/140,  853/140, -2341/420,  667/210,   -43/42,     1/7] # r = -1
    
weno_schemes: 
  1: # 1st-order WENO (trivial)
    inputs: [v1] # v1=u_i
    betas:
      beta0: "0" # r=1
    weights:
      d: [1]
  2:  # 3rd-order WENO (k=2 → 2k-1=3)
    inputs: [v1, v2, v3]  # v1=u_im1, v2=u_i, v3=u_ip1
    betas:
      beta0: "(v2 - v1)**2" # r=1
      beta1: "(v3 - v2)**2"
    weights:
      d: [1/3, 2/3]
  3:  # 5th-order WENO (k=3 → 2k-1=5)
    inputs: [v1, v2, v3, v4, v5]  # v1=u_im2, v2=u_im1, v3=u_i, v4=u_ip1, v5=u_ip2
    betas:
      beta0: "(13.0/12.0)*(v1 - 2*v2 + v3)**2 + (1.0/4.0)*(v1 - 4*v2 + 3*v3)**2"    # r=2
      beta1: "(13.0/12.0)*(v2 - 2*v3 + v4)**2 + (1.0/4.0)*(v2 - v4)**2"             # r=1
      beta2: "(13.0/12.0)*(v3 - 2*v4 + v5)**2 + (1.0/4.0)*(3*v3 - 4*v4 + v5)**2"    # r=0  
    weights:
      d: [1/10, 3/5, 3/10]
      
